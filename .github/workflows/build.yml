name: build

on:
  workflow_run:
    workflows: [tests]
    branches: [main]
    types: [completed]

concurrency:
  group: build-${{ github.event.workflow_run.head_branch  }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'

    strategy:
      fail-fast: true
      matrix:
        py-version:
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
          - "3.15"

    steps:
      - name: Checkout changes
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to docker hub
        run: make login PASSWORD=${{ secrets.DOCKER_TOKEN }}

      - name: Build and upload muffin
        run: >-
          make upload PY_VERSION=${{ matrix.py-version }}
          BUILD_CACHE="--cache-from type=gha,scope=muffin --cache-to type=gha,scope=muffin"

      - name: Build and upload muffin-node
        run: >-
          make upload BUILD_IMAGE=muffin-node PY_VERSION=${{ matrix.py-version }}
          BUILD_CACHE="--cache-from type=gha,scope=muffin-node --cache-to type=gha,scope=muffin-node"

  mark-latest:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Login to docker hub
        run: echo ${{ secrets.DOCKER_TOKEN }} | docker login -u horneds --password-stdin

      - name: Tag and push latest
        run: |
          docker buildx imagetools create -t horneds/muffin:latest horneds/muffin:py3.15
          docker buildx imagetools create -t horneds/muffin-node:latest horneds/muffin-node:py3.15
