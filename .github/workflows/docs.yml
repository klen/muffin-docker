name: docs

permissions:
  contents: read

on:
  workflow_run:
    workflows: [tests]
    branches: [main]
    types: [completed]

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Checkout changes
        uses: actions/checkout@v7

      - name: Upload README to docker hub
        run: make docs PASSWORD=${{ secrets.DOCKER_TOKEN }}
